name: VirusTotal scan

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to scan
        required: true
        default: v0.7.0
        type: string

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir artifacts
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts \
            --pattern 'srcustom.dll' --pattern 'libsrcustom.so'
          test -f artifacts/srcustom.dll
          test -f artifacts/libsrcustom.so

      - name: Upload and await VirusTotal analyses
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VT_API_KEY"
          : > virustotal-reports.md

          for file in artifacts/srcustom.dll artifacts/libsrcustom.so; do
            response=$(curl --fail-with-body --retry 3 --retry-delay 5 \
              --header "x-apikey: $VT_API_KEY" \
              --form "file=@$file" \
              https://www.virustotal.com/api/v3/files)
            analysis_id=$(jq -er '.data.id' <<<"$response")

            for attempt in {1..20}; do
              sleep 30
              response=$(curl --fail-with-body --retry 3 --retry-delay 5 \
                --header "x-apikey: $VT_API_KEY" \
                "https://www.virustotal.com/api/v3/analyses/$analysis_id")
              status=$(jq -er '.data.attributes.status' <<<"$response")
              [[ "$status" == completed ]] && break
              [[ "$attempt" == 20 ]] && { echo "VirusTotal analysis timed out for $file" >&2; exit 1; }
            done

            sha256=$(sha256sum "$file" | awk '{print $1}')
            stats=$(jq -c '.data.attributes.stats' <<<"$response")
            {
              echo "### $(basename "$file")"
              echo
              echo "SHA-256: \`$sha256\`"
              echo "VirusTotal: https://www.virustotal.com/gui/file/$sha256"
              echo "Result: \`$stats\`"
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY" >> virustotal-reports.md
          done

      - name: Add VirusTotal reports to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > release-notes.md
          sed '/<!-- virustotal-reports:start -->/,/<!-- virustotal-reports:end -->/d' release-notes.md > updated-notes.md
          {
            echo
            echo '<!-- virustotal-reports:start -->'
            echo '## VirusTotal reports'
            echo
            cat virustotal-reports.md
            echo '<!-- virustotal-reports:end -->'
          } >> updated-notes.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file updated-notes.md
