name: VirusTotal scan

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to scan
        required: true
        default: v0.7.0
        type: string

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir artifacts
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts \
            --pattern 'srcustom.dll' --pattern 'libsrcustom.so'
          test -f artifacts/srcustom.dll
          test -f artifacts/libsrcustom.so

      - name: Upload and await VirusTotal analyses
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$VT_API_KEY"
          : > virustotal-reports.md
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > release-assets.json

          for file in artifacts/srcustom.dll artifacts/libsrcustom.so; do
            sha256=$(sha256sum "$file" | awk '{print $1}')
            upload_body=$(mktemp)
            upload_status=$(curl --silent --show-error --retry 3 --retry-delay 5 \
              --output "$upload_body" --write-out '%{http_code}' \
              --header "x-apikey: $VT_API_KEY" \
              --form "file=@$file" \
              https://www.virustotal.com/api/v3/files)

            case "$upload_status" in
              200)
                analysis_id=$(jq -er '.data.id' "$upload_body")
                rm -f "$upload_body"
                for attempt in {1..20}; do
                  sleep 30
                  response=$(curl --silent --show-error --fail-with-body --retry 3 --retry-delay 5 \
                    --header "x-apikey: $VT_API_KEY" \
                    "https://www.virustotal.com/api/v3/analyses/$analysis_id")
                  status=$(jq -er '.data.attributes.status' <<<"$response")
                  [[ "$status" == completed ]] && break
                  [[ "$attempt" == 20 ]] && { echo "VirusTotal analysis timed out for $file" >&2; exit 1; }
                done
                ;;
              409)
                rm -f "$upload_body"
                ;;
              *)
                echo "VirusTotal upload failed for $file (HTTP $upload_status)" >&2
                jq -r '.error.message // empty' "$upload_body" >&2 || true
                rm -f "$upload_body"
                exit 1
                ;;
            esac

            response=$(curl --silent --show-error --fail-with-body --retry 3 --retry-delay 5 \
              --header "x-apikey: $VT_API_KEY" \
              "https://www.virustotal.com/api/v3/files/$sha256")
            malicious=$(jq -er '.data.attributes.last_analysis_stats.malicious // 0' <<<"$response")
            suspicious=$(jq -er '.data.attributes.last_analysis_stats.suspicious // 0' <<<"$response")
            asset_name=$(basename "$file")
            asset_url=$(jq -er --arg name "$asset_name" '.assets[] | select(.name == $name) | .url' release-assets.json)
            {
              echo "## [$asset_name]($asset_url)"
              echo
              echo "\`$sha256\`"
              echo
              echo "[VirusTotal report](https://www.virustotal.com/gui/file/$sha256)"
              echo
              echo "Detection: $malicious malicious, $suspicious suspicious"
              echo
            } >> virustotal-reports.md
          done

          cat virustotal-reports.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add VirusTotal reports to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > release-notes.md
          sed '/<!-- virustotal-reports:start -->/,/<!-- virustotal-reports:end -->/d' release-notes.md > updated-notes.md
          {
            echo
            echo '<!-- virustotal-reports:start -->'
            echo '## VirusTotal reports'
            echo
            cat virustotal-reports.md
            echo '<!-- virustotal-reports:end -->'
          } >> updated-notes.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file updated-notes.md
